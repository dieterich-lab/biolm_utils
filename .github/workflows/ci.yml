name: CI

env:
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Cache Poetry & pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-poetry-
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry and dev deps
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          poetry --version
          poetry install --no-interaction --with dev
      - name: Run test suite
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry run pytest -q tests \
            --ignore=tests/integration/test_plugin_discovery.py \
            --ignore=tests/test_hydra_config_smoke.py \
            --ignore=tests/test_mlflow_integration.py \
            --ignore=tests/test_runner_mlflow.py \
            --ignore=tests/test_mlflow_smoke.py
      - name: Run Hydra configuration smoke tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry run pytest -q tests/test_hydra_config_smoke.py

  mlflow-smoke:
    name: MLflow smoke tests
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install Poetry and dependencies + mlflow
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          poetry install --no-interaction --with dev
          poetry install --no-interaction --with mlflow
      - name: Run MLflow smoke tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry run pytest -q tests/test_mlflow_integration.py tests/test_runner_mlflow.py tests/test_mlflow_smoke.py

  plugin-compat:
    name: Plugin compatibility
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: biolm_utils
      - name: Checkout Saluki plugin
        uses: actions/checkout@v4
        with:
          repository: dieterich-lab/rna_saluki_cnn
          ref: main
          path: rna_saluki_cnn
      - name: Checkout XLNet plugin
        uses: actions/checkout@v4
        with:
          repository: dieterich-lab/rna_protein_xlnet
          ref: main
          path: rna_protein_xlnet
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          poetry --version
      - name: Install plugins
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd rna_saluki_cnn
          poetry install --no-interaction
          cd ../rna_protein_xlnet
          poetry install --no-interaction
          cd ..
      - name: Install framework (agnostic) and add local plugins
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd biolm_utils
          poetry install --no-interaction --with dev
          # install checked-out plugins into the same venv without touching pyproject
          poetry run pip install ../rna_saluki_cnn ../rna_protein_xlnet
      - name: Run plugin discovery tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd biolm_utils
          poetry run pytest -xvs tests/integration/test_plugin_discovery.py

