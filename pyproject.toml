[project]
name = "biolm"
version = "0.0.3"
description = "Utilities and orchestration helpers for training and interpreting biolanguage models"
authors = [{name = "dieterich-lab", email = "noreply@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate",
    "ferret-xai==0.4.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "pandas==2.2.2",
    "torch==2.3.1",
    "torchaudio==2.3.1",
    "torchvision==0.18.1",
    "transformers==4.57.3",
    "mlflow>=3.6.0",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.0.0"]

[project.urls]
repository = "https://github.com/dieterich-lab/biolm_utils"

[project.scripts]
biolm = "biolm.cli:parse_args"

# External plugins are now separate packages:
#   - rna-saluki-cnn: Saluki CNN model for RNA sequence analysis
#   - rna-protein-xlnet: XLNet model for RNA/protein analysis
# To use these plugins, install them separately:
#   poetry add /path/to/rna_saluki_cnn
#   poetry add /path/to/rna_protein_xlnet
# The plugins register themselves via their own entry points.

[project.entry-points."biolm.plugins"]
# No builtin plugins - all plugins are now external packages

[tool.poetry]
# Legacy section for Poetry compatibility
name = "biolm"
version = "0.0.3"
description = "Utilities and orchestration helpers for training and interpreting biolanguage models"
authors = ["dieterich-lab philipp.wiesenbach@uni-heidelberg.de"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
accelerate = "*"
ferret-xai = "0.4.0"
hydra-core = ">=1.3.0"
omegaconf = ">=2.3.0"
pandas = "2.2.2"
torch = "2.3.1"
torchaudio = "2.3.1"
torchvision = "0.18.1"
transformers = "4.57.3"
mlflow = "^3.6.0"

[tool.poetry.group.dev]
optional = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
pytest-mock = "^3.15.1"
debugpy = "*"

[tool.poetry.group.mlflow]
optional = true

[tool.poetry.group.mlflow.dependencies]
mlflow = ">=2.0.0"


[tool.poetry.extras]
mlflow = ["mlflow"]

[tool.poetry.urls]
repository = "https://github.com/dieterich-lab/biolm_utils"

[tool.poetry.scripts]
biolm = "biolm.cli:parse_args"

# External plugins are now separate packages - see [project.entry-points."biolm.plugins"] above
[tool.poetry.plugins."biolm.plugins"]
# No builtin plugins - all plugins are now external packages

[tool.pyright]
typeCheckingMode = "off"

[tool.mypy]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
